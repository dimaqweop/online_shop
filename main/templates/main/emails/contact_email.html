<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нове повідомлення з форми зворотного зв'язку</title>
</head>

<body
    style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; color: #1e293b;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
        style="background-color: #f1f5f9; padding: 30px 15px;">
        <tr>
            <td align="center">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
                    style="max-width: 600px; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); border: 1px solid #e2e8f0;">

                    <tr>
                        <td
                            style="background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%); background-color: #2563eb; padding: 35px 30px; text-align: center;">
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center">
                                        <div
                                            style="display: inline-block; background-color: rgba(255, 255, 255, 0.15); padding: 8px 18px; border-radius: 10px; margin-bottom: 12px;">
                                            <span
                                                style="color: #ffffff; font-size: 20px; font-weight: 800; letter-spacing: -0.5px;">Nova<span
                                                    style="color: #fbbf24;">Store</span></span>
                                        </div>
                                        <h1
                                            style="color: #ffffff; font-size: 22px; font-weight: 700; margin: 0; line-height: 1.3;">
                                            Нове повідомлення з сайту
                                        </h1>
                                        <p style="color: #bfdbfe; font-size: 14px; margin: 6px 0 0 0;">
                                            Отримано через форму зворотного зв'язку
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 32px 30px;">

                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
                                style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 24px; padding: 16px;">
                                <tr>
                                    <td>
                                        <table role="presentation" border="0" cellpadding="0" cellspacing="0"
                                            width="100%">
                                            <tr>
                                                <td
                                                    style="padding: 6px 0; width: 140px; color: #64748b; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">
                                                    👤 Відправник:
                                                </td>
                                                <td
                                                    style="padding: 6px 0; color: #0f172a; font-size: 15px; font-weight: 700;">
                                                    {{ name }}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td
                                                    style="padding: 6px 0; color: #64748b; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">
                                                    ✉️ Email:
                                                </td>
                                                <td style="padding: 6px 0;">
                                                    <a href="mailto:{{ email }}"
                                                        style="color: #2563eb; text-decoration: none; font-size: 15px; font-weight: 600;">
                                                        {{ email }}
                                                    </a>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td
                                                    style="padding: 6px 0; color: #64748b; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">
                                                    📌 Тема:
                                                </td>
                                                <td
                                                    style="padding: 6px 0; color: #0f172a; font-size: 15px; font-weight: 600;">
                                                    {{ subject }}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <div style="margin-bottom: 28px;">
                                <h2
                                    style="font-size: 14px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 10px 0;">
                                    💬 Текст повідомлення:
                                </h2>
                                <div
                                    style="background-color: #f1f5f9; border-left: 4px solid #2563eb; border-radius: 4px 8px 8px 4px; padding: 18px 20px; font-size: 15px; line-height: 1.65; color: #1e293b; white-space: pre-line;">
                                    {{ message }}
                                </div>
                            </div>

                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center" style="padding-top: 8px;">
                                        <a href="mailto:{{ email }}?subject=Re: {{ subject|urlencode }}"
                                            style="display: inline-block; background-color: #2563eb; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 700; padding: 13px 26px; border-radius: 8px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);">
                                            ↩️ Відповісти на повідомлення
                                        </a>
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <tr>
                        <td
                            style="background-color: #0f172a; padding: 22px 30px; text-align: center; border-top: 1px solid #1e293b;">
                            <p style="color: #94a3b8; font-size: 13px; margin: 0; line-height: 1.5;">
                                © 2026 <strong>NovaStore</strong>. Це автоматичне сповіщення з контактної форми
                                магазину.
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
